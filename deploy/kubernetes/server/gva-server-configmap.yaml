apiVersion: v1
kind: ConfigMap
metadata:
  name: config.yaml
  annotations:
    flipped-aurora/gin-vue-admin: backend
    github: "https://github.com/flipped-aurora/gin-vue-admin.git"
    app.kubernetes.io/version: 0.0.1
  labels:
    app: gva-server
    version: gva-vue3
data:
  config.yaml: |
    # github.com/flipped-aurora/gin-vue-admin/server Global Configuration

    # jwt configuration
    jwt:
      signing-key: 'qmPlus'
      expires-time: '7d'
      buffer-time: '1d'
      issuer: 'qmPlus'

    # zap logger configuration
    zap:
      level: 'info'
      format: 'console'
      prefix: '[github.com/flipped-aurora/gin-vue-admin/server]'
      director: 'log'
      show-line: true
      retention-day: -1
      encode-level: 'LowercaseColorLevelEncoder'
      stacktrace-key: 'stacktrace'
      log-in-console: true

    # redis configuration
    redis:
      db: 0
      addr: '127.0.0.1:6379'
      password: ''

    # email configuration
    email:
      to: 'xxx@qq.com'
      port: 465
      from: 'xxx@163.com'
      host: 'smtp.163.com'
      is-ssl: true
      secret: 'xxx'
      nickname: 'test'

    # system configuration（验证码/锁定等安全配置已迁到数据库 sys_security_config，
    # 不再放在这里；casbin 模型路径由代码固定，不需要配置）
    system:
      addr: 8888
      db-type: 'mysql'
      oss-type: 'local'
      router-prefix: ''
      use-multipoint: false
      use-redis: false
      use-mongo: false

    # mysql connect configuration
    # 未初始化之前请勿手动修改数据库信息！！！如果一定要手动初始化请看（https://www.github.com/flipped-aurora/gin-vue-admin/server.com/docs/first）
    mysql:
      path: ''
      port: '3306'
      config: 'charset=utf8mb4&parseTime=True&loc=Local'
      db-name: ''
      username: ''
      password: ''
      max-idle-conns: 10
      max-open-conns: 100
      log-mode: 'error'

    # local configuration
    local:
      path: 'uploads/file'

    # autocode configuration（root 留空，由程序启动时自动识别）
    autocode:
      root: ""
      server: server
      web: web/src
      module: 'github.com/flipped-aurora/gin-vue-admin/server'
      ai-path: ""

    # qiniu configuration (请自行七牛申请对应的 公钥 私钥 bucket 和 域名地址)
    qiniu:
      zone: 'ZoneHuaDong'
      bucket: ''
      img-path: ''
      use-https: false
      access-key: ''
      secret-key: ''
      use-cdn-domains: false


    # aliyun oss configuration
    aliyun-oss:
      endpoint: 'yourEndpoint'
      access-key-id: 'yourAccessKeyId'
      access-key-secret: 'yourAccessKeySecret'
      bucket-name: 'yourBucketName'
      bucket-url: 'yourBucketUrl'
      base-path: 'yourBasePath'

    # tencent cos configuration
    tencent-cos:
      bucket: 'xxxxx-10005608'
      region: 'ap-shanghai'
      secret-id: 'xxxxxxxx'
      secret-key: 'xxxxxxxx'
      base-url: 'https://gin.vue.admin'
      path-prefix: 'github.com/flipped-aurora/gin-vue-admin/server'
